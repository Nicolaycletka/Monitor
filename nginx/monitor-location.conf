# Вставить ВНУТРЬ существующего server-блока, который отдаёт
# burmalda.host на 443 TCP. Ничего в нём менять не нужно —
# только добавить эти три location.

    # /monitor -> /monitor/ , иначе относительные ссылки уедут в корень
    location = /monitor {
        return 301 /monitor/;
    }

    location /monitor/ {
        # без слеша в конце proxy_pass: nginx передаёт URI как есть,
        # приложение само знает, что живёт в /monitor
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # service worker не кешируем, иначе обновления не доедут до телефона
    location = /monitor/sw.js {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
