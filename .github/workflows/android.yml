name: APK для Android

# Ручной запуск кнопкой + автоматически на тег вида v1.2.
#
# На КАЖДЫЙ push намеренно не собираем: APK нужен не после каждой
# правки, а когда его собираются кому-то отдать, а полная сборка
# занимает несколько минут и место в хранилище артефактов.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Адрес API (по умолчанию берётся из package.json)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Именно 17: шаблон Capacitor 6 закреплён на Gradle 8.2.1 и
      # AGP 8.2.1, на Java 21 сборка падает с
      # «Unsupported class file major version».
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # На образе ubuntu-latest Android SDK уже установлен, но набор
      # платформ со временем меняется. Ставим нужные явно, чтобы сборка
      # не сломалась в тот день, когда GitHub обновит образ.
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Зависимости
        run: |
          npm ci
          cd web && npm ci

      # Автономный APK: фронтенд собирается с АБСОЛЮТНЫМ адресом API,
      # иначе внутри приложения запросы уйдут в никуда.
      - name: Сборка фронтенда и синхронизация
        run: |
          if [ -n "${{ inputs.api_url }}" ]; then
            cd web && BASE_PATH=/ VITE_API_URL="${{ inputs.api_url }}" npm run build && cd ..
            npx cap sync android
          else
            npm run android:build
          fi

      # Идентификатор сборки — имя собранного файла. Он же приезжает с
      # сервера в ответе на синк, и приложение сравнивает их, чтобы
      # показать «вышла новая версия». Печатаем, чтобы можно было
      # сверить с тем, что сейчас развёрнуто на сервере.
      - name: Идентификатор сборки
        run: |
          BUILD=$(grep -o 'assets/[A-Za-z0-9._-]*\.js' web/dist/index.html | head -1 | cut -d/ -f2)
          echo "Собранный фронтенд: $BUILD" >> $GITHUB_STEP_SUMMARY
          echo "Сверьте с полем build в ответе сервера на /api/sync." >> $GITHUB_STEP_SUMMARY

      # Ключ подписи лежит в секретах репозитория, а не в коде.
      # Без него собираем отладочный APK — он тоже ставится, но см.
      # предупреждение ниже.
      - name: Ключ подписи
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/monitor.keystore"
            echo "have=yes" >> $GITHUB_OUTPUT
          else
            echo "have=no" >> $GITHUB_OUTPUT
            echo "⚠️ Ключ подписи не задан — собран отладочный APK." >> $GITHUB_STEP_SUMMARY
            echo "У каждой такой сборки СВОЯ подпись, поэтому обновить" >> $GITHUB_STEP_SUMMARY
            echo "установленное приложение не выйдет: придётся удалять и" >> $GITHUB_STEP_SUMMARY
            echo "ставить заново. Как завести ключ — в ANDROID.md." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Подписанная сборка
        if: steps.key.outputs.have == 'yes'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PMONITOR_KEYSTORE="$RUNNER_TEMP/monitor.keystore" \
            -PMONITOR_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PMONITOR_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PMONITOR_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Отладочная сборка
        if: steps.key.outputs.have == 'no'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Собрать APK в одно место
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 90

      # На тег ещё и релиз: у файла появляется постоянная ссылка,
      # которую можно просто отправить родственникам, вместо того
      # чтобы каждому пересылать файл.
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
